name: Update Schedule

on:
  schedule:
    - cron: '0 15 * * 2'
    - cron: '0 10 * * 5'
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update_schedule:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Update schedule
      run: |
        for year in 2026 2027; do
          swift run MotorsportCalendar --output ./data --formula1-calendar-url ${{ secrets.FORMULA_1_CALENDAR_URL }} --year $year
        done

    - name: Check for changes
      id: changes
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "Changes detected"
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "No changes detected"
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit changes
      if: steps.changes.outputs.changed == 'true'
      run: |
        git checkout -b auto/update-schedule
        git add -A
        git commit -m "Update schedule"
        git push origin auto/update-schedule --force

    - name: Create Pull Request
      if: steps.changes.outputs.changed == 'true'
      run: ./Scripts/create_changes_pr.sh

    - name: Run tests on pull request
      if: steps.changes.outputs.changed == 'true'
      run: gh workflow run tests.yml --ref auto/update-schedule
